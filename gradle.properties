# Packaging the debug APKs (one CPU library per instruction set, unoptimized) needs more than the default heap.
org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
# Version of the published libraries and the Den app; a release passes -Pden.version from its tag.
den.version=0.1.0-SNAPSHOT
# LiteRT (the LiteRT-LM backend) depends on AndroidX.
android.useAndroidX=true
